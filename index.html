<h1>Red Robin Backup</h1>
<p>Red Robin Backup is a small private tool that copies one owner's own encrypted data backups to that owner's own Google Drive.</p>
<p>It is not a public service and has no other users. It only creates and manages the files it uploads itself.</p>
